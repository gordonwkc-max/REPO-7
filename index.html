<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Buyback Counter — a 20 second rehearsal</title>
<style>
  :root{
    --bg:#0a0d0f;
    --ink:#ece6d9;
    --dim:#8b8b83;
    --line:rgba(236,230,217,.14);
    --line-soft:rgba(236,230,217,.07);
    --amber:#f0b862;
    --amber-dim:rgba(240,184,98,.18);
    --green:#46e08b;
    --red:#e8705c;
    --panel:rgba(14,18,20,.82);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0}

  /* ---------- stage ---------- */
  #stageWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- header ---------- */
  header.top{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
    padding:18px 22px 0;pointer-events:none;
  }
  .brand{display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .brand .row{display:flex;align-items:center;gap:9px}
  .gem{
    width:9px;height:9px;transform:rotate(45deg);border-radius:1px;
    background:linear-gradient(135deg,#9dffc8,#28c973 60%,#0d6b3c);
    box-shadow:0 0 10px rgba(70,224,139,.75);
  }
  .brand h1{
    font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.24em;
    margin:0;text-transform:uppercase;color:#f4eee1;
  }
  .brand .sub{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;
  }

  /* origin cluster */
  .origin{
    pointer-events:auto;display:flex;align-items:center;gap:10px;
    background:rgba(10,13,15,.55);border:1px solid var(--line-soft);border-radius:10px;
    padding:8px 10px;backdrop-filter:blur(10px);
  }
  .origin .lbl{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#9a9a90;
    text-transform:uppercase;padding-right:2px;
  }
  .oField{display:flex;align-items:center;gap:5px}
  .oField span{
    font-family:var(--mono);font-size:9.5px;color:#6f736f;letter-spacing:.1em;
  }
  .oField input{
    width:52px;background:rgba(255,255,255,.045);border:1px solid var(--line-soft);
    color:#f2ecdf;font-family:var(--mono);font-size:11px;padding:4px 5px;border-radius:5px;
    text-align:center;-moz-appearance:textfield;appearance:textfield;
  }
  .oField input::-webkit-outer-spin-button,
  .oField input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .oField input:focus{outline:none;border-color:rgba(240,184,98,.55);background:rgba(240,184,98,.08)}
  .origin button{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:#9a9a90;
    background:transparent;border:1px solid var(--line-soft);border-radius:5px;
    padding:5px 7px;cursor:pointer;text-transform:uppercase;
  }
  .origin button:hover{color:var(--amber);border-color:rgba(240,184,98,.4)}

  /* ---------- dock ---------- */
  footer.dock{
    flex:0 0 auto;position:relative;z-index:6;
    background:linear-gradient(180deg,rgba(10,13,15,.2),rgba(10,13,15,.92) 22%,#0a0d0f 100%);
    border-top:1px solid var(--line-soft);
    padding:14px 22px 16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .transport{display:flex;align-items:center;gap:14px}
  .btn{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#dcd6c8;background:rgba(255,255,255,.035);border:1px solid var(--line);
    padding:9px 13px;border-radius:7px;cursor:pointer;transition:.14s ease;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.075);border-color:rgba(236,230,217,.28);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn.play{min-width:96px;justify-content:center;color:#12100c;background:var(--amber);border-color:var(--amber);font-weight:600}
  .btn.play:hover{background:#ffc978;border-color:#ffc978;color:#12100c}
  .btn .tri{width:0;height:0;border-style:solid}
  .btn .tri.p{border-width:5px 0 5px 8px;border-color:transparent transparent transparent currentColor;margin-left:1px}
  .btn .tri.s{width:8px;height:10px;border:none;background:currentColor;
    clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,100% 0,100% 100%,65% 100%,65% 0)}
  .btn.ghost{background:transparent;border-color:var(--line-soft);color:#8e8e86}
  .btn.ghost:hover{color:#ded8ca;border-color:var(--line)}
  .clock{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#cfc9bb;white-space:nowrap;
    font-variant-numeric:tabular-nums;min-width:104px;
  }
  .clock b{color:#fff;font-weight:600}
  .clock i{color:#5f625d;font-style:normal}

  /* seek */
  .seek{position:relative;flex:1 1 auto;min-width:120px;height:30px;display:flex;align-items:center;
    touch-action:none;cursor:pointer;user-select:none}
  .seek .rail{
    position:absolute;left:0;right:0;height:5px;border-radius:3px;
    background:rgba(255,255,255,.075);overflow:hidden;
  }
  .seek .win{position:absolute;top:0;bottom:0;background:rgba(240,184,98,.16);
    border-left:1px solid rgba(240,184,98,.35);border-right:1px solid rgba(240,184,98,.35)}
  .seek .fill{position:absolute;top:0;bottom:0;left:0;width:0;
    background:linear-gradient(90deg,#a5813f,var(--amber));}
  .seek .ticks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .seek .tick{position:absolute;top:9px;width:1px;height:12px;background:rgba(236,230,217,.28)}
  .seek .tick.major{height:15px;top:7.5px;background:rgba(236,230,217,.5)}
  .seek .tick em{
    position:absolute;top:21px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:8.5px;font-style:normal;color:#6c706b;letter-spacing:.08em;
  }
  .seek .knob{
    position:absolute;width:13px;height:13px;border-radius:50%;left:0;top:50%;
    transform:translate(-50%,-50%);background:#fff5e2;
    box-shadow:0 0 0 3px rgba(240,184,98,.16),0 0 14px rgba(240,184,98,.55);
    pointer-events:none;
  }
  .seek:focus{outline:none}
  .seek:focus-visible .knob{box-shadow:0 0 0 4px rgba(240,184,98,.4),0 0 18px rgba(240,184,98,.7)}

  .speeds{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .speeds .sb{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#8e8e86;background:transparent;
    border:0;border-right:1px solid var(--line-soft);padding:9px 10px;cursor:pointer;transition:.12s;
  }
  .speeds .sb:last-child{border-right:0}
  .speeds .sb:hover{color:#e6e0d2;background:rgba(255,255,255,.05)}
  .speeds .sb.on{color:#12100c;background:var(--amber);font-weight:600}

  /* inputs row */
  .inputs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .inputs .tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#7d817c;text-transform:uppercase;
    padding-right:2px;
  }
  .ib{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#e2dccd;background:rgba(255,255,255,.04);border:1px solid var(--line);
    padding:9px 14px;border-radius:7px;cursor:pointer;transition:.14s;position:relative;
    display:inline-flex;align-items:center;gap:8px;
  }
  .ib .k{
    font-size:8.5px;color:#7d817c;border:1px solid var(--line-soft);border-radius:3px;padding:1px 4px;
  }
  .ib:hover:not(.off){background:rgba(255,255,255,.08);border-color:rgba(236,230,217,.3)}
  .ib.on-hold{background:rgba(70,224,139,.14);border-color:rgba(70,224,139,.55);color:#b9ffd8}
  .ib.off{opacity:.34;cursor:not-allowed}
  .ib.flash{animation:flash .34s ease}
  @keyframes flash{0%{background:rgba(232,112,92,.3);border-color:var(--red)}100%{}}
  .ib .dotp{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}

  .status{
    margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#787c77;
  }
  .chip{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-soft);
    padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.025);color:#c9c3b5;
  }
  .chip s{text-decoration:none;color:#6f736f}
  .chip .v{color:#efe9db;font-weight:600}
  .chip .v.on{color:var(--green)}
  .chip .v.warn{color:var(--amber)}
  .chip .v.bad{color:var(--red)}
  .chip .v.mute{color:#8a8e89}

  .hint{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#5c605c;
    text-transform:uppercase;
  }
  @media (max-width:760px){
    header.top{padding:12px 14px 0}
    .brand h1{font-size:11px;letter-spacing:.18em}
    footer.dock{padding:11px 12px 13px;gap:9px}
    .transport{flex-wrap:wrap;gap:9px}
    .seek{order:5;flex-basis:100%;min-width:0}
    .clock{min-width:0}
    .btn.play{min-width:84px}
    .origin{padding:6px 7px;gap:6px}
    .oField input{width:44px}
    .hint{display:none}
    .status{font-size:8.5px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" aria-label="The Buyback Counter, a voxel diorama"></canvas>
    <header class="top">
      <div class="brand">
        <div class="row"><span class="gem"></span><h1>The Buyback Counter</h1></div>
        <div class="sub">a twenty-second rehearsal · voxel diorama</div>
      </div>
      <div class="origin" title="World origin. Moving it translates the diorama; the camera follows.">
        <span class="lbl">Origin</span>
        <label class="oField"><span>X</span><input id="ox" type="number" step="0.5" value="0" inputmode="decimal"></label>
        <label class="oField"><span>Y</span><input id="oy" type="number" step="0.5" value="0" inputmode="decimal"></label>
        <label class="oField"><span>Z</span><input id="oz" type="number" step="0.5" value="0" inputmode="decimal"></label>
        <button id="originReset" title="Back to the default origin">zero</button>
      </div>
    </header>
  </div>

  <footer class="dock">
    <div class="transport">
      <button class="btn play" id="play" aria-label="Play or pause">
        <span class="tri p" id="playIcon"></span><span id="playLabel">Play</span>
      </button>
      <div class="clock"><b id="clockNow">00.00</b><i> / 20.00 s</i></div>
      <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek, zero to twenty seconds"
           aria-valuemin="0" aria-valuemax="20" aria-valuenow="0">
        <div class="rail"><div class="win" id="seekWin"></div><div class="fill" id="seekFill"></div></div>
        <div class="ticks" id="seekTicks"></div>
        <div class="knob" id="seekKnob"></div>
      </div>
      <div class="speeds" id="speeds" aria-label="Playback speed">
        <button class="sb" data-sp="0.5">0.5×</button>
        <button class="sb on" data-sp="1">1×</button>
        <button class="sb" data-sp="2">2×</button>
      </div>
      <button class="btn ghost" id="reset" title="Pause at zero and clear recorded inputs">Reset</button>
    </div>
    <div class="inputs">
      <span class="tag">Inputs</span>
      <button class="ib" id="inTake" data-type="take"><span class="dotp"></span>Take <span class="k">Q</span></button>
      <button class="ib" id="inReturn" data-type="return"><span class="dotp"></span>Return <span class="k">W</span></button>
      <button class="ib" id="inInspect" data-type="inspect"><span class="dotp"></span>Inspect rear <span class="k">E</span></button>
      <span class="hint">accepted 4.00 → 11.99 s</span>
      <div class="status">
        <span class="chip"><s>branch</s><span class="v mute" id="stBranch">pending</span></span>
        <span class="chip"><s>emerald</s><span class="v" id="stHeld">—</span></span>
        <span class="chip"><s>rear</s><span class="v" id="stRear">—</span></span>
        <span class="chip"><s>trapdoor</s><span class="v" id="stTrap">shut</span></span>
      </div>
    </div>
  </footer>
</div>
<script>
/* ============================================================================
   THE BUYBACK COUNTER — a 20 second voxel rehearsal.
   No libraries. No network. One canvas, one deterministic simulation.
   ========================================================================== */
(function () {
'use strict';

/* ---------------------------------------------------------------- constants */
var T_MAX = 20;          // seconds
var WIN_A = 4;           // input window opens
var WIN_B = 12;          // input window closes, ending latches
var TRAP_AT = 14;        // trapdoor opens (trap ending only)
var DEF_ORIGIN = [0, 0, 0];

/* ---------------------------------------------------------------- scalar math */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function win(t, a, b) { var d = b - a; return clamp(d === 0 ? (t >= b ? 1 : 0) : (t - a) / d, 0, 1); }
function ss(t, a, b) { var x = win(t, a, b); return x * x * (3 - 2 * x); }
function ssi(t, a, b) { var x = win(t, a, b); return 1 - (1 - x) * (1 - x) * (1 - x); }
function bell(t, a, b) { return Math.sin(Math.PI * win(t, a, b)); }
// ramp up over fi, hold, down over fo  (defaults are gentle)
function ramp(t, a, b, fi, fo) {
  fi = fi === undefined ? 0.18 : fi; fo = fo === undefined ? 0.18 : fo;
  var u = ss(t, a, a + fi);
  var v = 1 - ss(t, b - fo, b);
  return Math.min(u, v);
}
function pinch(t, a, b) { return ss(t, a, b); }
function pulse(t, a, b, hold) {
  // 0 -> 1 quickly at a, stay until b, back down
  var up = ss(t, a, a + (hold || 0.12));
  var dn = 1 - ss(t, b, b + (hold || 0.12));
  return Math.min(up, dn);
}
function hash1(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hash2(a, b) { return hash1(a * 57.31 + b * 19.77 + 0.123); }
function wob(t, f, ph) { return Math.sin(t * f + (ph || 0)); }
function dampK(t, k) { return 1 - Math.exp(-t * k); }

/* ---------------------------------------------------------------- vectors */
function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vmul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vlerp(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
function vlen(a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]); }

/* ---------------------------------------------------------------- colour */
function hex(h) {
  return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
}
function rgbStr(c, a) {
  return a === undefined || a >= 1
    ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
    : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')';
}
function mixc(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
function scalec(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function brighten(c, k) { return [Math.min(255, c[0] + 255 * k), Math.min(255, c[1] + 255 * k), Math.min(255, c[2] + 255 * k)]; }

/* ---------------------------------------------------------------- affine transforms
   A transform is {m:[9] row-major 3x3, t:[3]}. Points: p' = m*p + t.
   Used for actors and props; the same helpers are used by the simulation
   (to find hand positions) and by the renderer (to build geometry), which is
   how props and the emerald stay welded to hands. */
var IDENT = { m: [1, 0, 0, 0, 1, 0, 0, 0, 1], t: [0, 0, 0] };
function xfT(x, y, z) { return { m: IDENT.m.slice(), t: [x, y, z] }; }
function xfMul(a, b) {
  // returns a ∘ b  (apply b first, then a)
  var am = a.m, bm = b.m, m = new Array(9), i, j;
  for (i = 0; i < 3; i++) for (j = 0; j < 3; j++)
    m[i * 3 + j] = am[i * 3] * bm[j] + am[i * 3 + 1] * bm[3 + j] + am[i * 3 + 2] * bm[6 + j];
  var t = [
    a.t[0] + am[0] * b.t[0] + am[1] * b.t[1] + am[2] * b.t[2],
    a.t[1] + am[3] * b.t[0] + am[4] * b.t[1] + am[5] * b.t[2],
    a.t[2] + am[6] * b.t[0] + am[7] * b.t[1] + am[8] * b.t[2]
  ];
  return { m: m, t: t };
}
function xfRotX(a) { var c = Math.cos(a), s = Math.sin(a); return { m: [1, 0, 0, 0, c, -s, 0, s, c], t: [0, 0, 0] }; }
function xfRotY(a) { var c = Math.cos(a), s = Math.sin(a); return { m: [c, 0, s, 0, 1, 0, -s, 0, c], t: [0, 0, 0] }; }
function xfRotZ(a) { var c = Math.cos(a), s = Math.sin(a); return { m: [c, -s, 0, s, c, 0, 0, 0, 1], t: [0, 0, 0] }; }
function xfScale(x, y, z) { return { m: [x, 0, 0, 0, y, 0, 0, 0, z], t: [0, 0, 0] }; }
function xfApply(x, p) {
  var m = x.m, t = x.t;
  return [m[0] * p[0] + m[1] * p[1] + m[2] * p[2] + t[0],
          m[3] * p[0] + m[4] * p[1] + m[5] * p[2] + t[1],
          m[6] * p[0] + m[7] * p[1] + m[8] * p[2] + t[2]];
}

/* ---------------------------------------------------------------- rig helpers
   Pose objects carry their own skeleton metrics so the same maths serves the
   merchant, the customer and every prop welded to a hand. */
function poseXf(pose) {
  var x = xfT(pose.x, pose.y, pose.z);
  x = xfMul(x, xfRotY(pose.yaw));
  if (pose.lean) {
    var hy = pose.hipY;
    x = xfMul(x, xfT(0, hy, 0));
    x = xfMul(x, xfRotX(pose.lean));
    x = xfMul(x, xfT(0, -hy, 0));
  }
  if (pose.twist) x = xfMul(x, xfRotY(pose.twist));
  return x;
}
function shoulderXf(pose, side) {
  var a = side === 'R' ? pose.armR : pose.armL;
  // arm[1] = outward spread (positive = away from the body)
  var zrot = (side === 'R' ? a[1] : -a[1]);
  var root = xfMul(poseXf(pose), xfT(0, pose.shoulderY, 0));
  root = xfMul(root, xfRotZ(zrot));
  root = xfMul(root, xfRotX(a[0]));
  return root;
}
function handPos(pose, side) {
  return xfApply(shoulderXf(pose, side), [0, -pose.armLen, 0]);
}


/* ============================================================================
   SIMULATION — one deterministic function of (time, inputs, origin).
   Both the renderer and window.sceneBench.evaluate call simulate(); there is
   no second, test-only code path.
   ========================================================================== */

var L = {
  // the buyback counter runs front-to-back, with the merchant on its left
  // and the customer on its right, both angled toward the camera.
  ctr: { x0: 0.22, x1: 0.92, z0: -0.95, z1: 0.95, top: 1.02 },
  merch: [-0.46, 0, 0.34],
  merchYaw: 1.30,
  cust: [1.80, 0, 0.92],
  custYaw: -1.24,
  mat: { cx: 1.80, cz: 1.20, w: 2.34, d: 2.34 },
  hole: { x0: 0.80, z0: 0.20, x1: 2.80, z1: 2.20, depth: 2.35 },
  lever: [0.24, 1.02, 0.94],
  emHome: [0.55, 1.27, -0.40],
  souvHome: [0.60, 1.06, 0.50],
  junction: [0.96, 0.30, 1.06]
};

var BEAT = {
  arrive: 2.35,
  knock1: 1.98, knock2: 2.22,
  cardUp: 2.36, cardDown: 6.30,
  showSouv: 2.62, handSouv: 3.90, merchSet: 5.02,
  emWake: 3.52,
  grabMiss: 5.10,
  nudgeLever: 6.55,
  stomp: 8.92,
  shush: 9.10,
  swat: 10.22,
  finalLean: 11.25
};

/* ---------------------------------------------------------------- inputs */
function numOr(v, d) {
  var n = typeof v === 'number' ? v : (typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN);
  return isFinite(n) ? n : d;
}
function acceptActions(raw) {
  var out = [];
  if (!raw || typeof raw.length !== 'number') return out;

  box3(root, -2.55, 0.32, 2.85, 0.64, 0.64, 0.64, C.wood, {});
  box3(root, -2.40, 0.78, 2.80, 0.44, 0.36, 0.44, C.woodD, {});
  box3(root, -1.72, 0.42, 3.15, 0.50, 0.84, 0.50, C.woodL, {});
  box3(root, -1.72, 0.66, 3.15, 0.55, 0.1, 0.55, C.brass, {});
}

function buildBooth(root, st) {
  var c = L.ctr, t = st.t, m = st.mech, i;
  var w = c.x1 - c.x0, d = c.z1 - c.z0, cz = (c.z0 + c.z1) / 2;
  // body
  box3(root, (c.x0 + c.x1) / 2, 0.56, cz, w - 0.06, 0.92, d - 0.10, C.wood, {});
  // front planks (facing the camera / +x)
  var n = 7;
  for (i = 0; i < n; i++) {
    var z0 = c.z0 + 0.06 + i * ((d - 0.12) / n);
    var z1 = z0 + (d - 0.12) / n - 0.045;
    var r = hash2(i * 2.3, 4.1);
    slab(root, c.x1 - 0.02, 0.12, z0, c.x1 + 0.05, 0.96, z1, r < 0.5 ? C.woodL : C.wood, {});
    slab(root, c.x1 + 0.045, 0.12, z0, c.x1 + 0.065, 0.18, z1, C.woodD, {});
    slab(root, c.x1 + 0.045, 0.90, z0, c.x1 + 0.065, 0.96, z1, C.woodD, {});
  }
  // a drawer in the near end
  slab(root, c.x0 + 0.02, 0.34, c.z1 - 0.015, c.x1 - 0.02, 0.62, c.z1 + 0.035, C.woodL, {});
  slab(root, c.x0 + 0.10, 0.45, c.z1 + 0.03, c.x1 - 0.10, 0.51, c.z1 + 0.06, C.brass, {});
  // top
  box3(root, (c.x0 + c.x1) / 2 - 0.01, c.top + 0.045, cz, w + 0.20, 0.09, d + 0.14, C.woodL, {});
  box3(root, (c.x0 + c.x1) / 2 - 0.01, c.top + 0.10, cz, w + 0.22, 0.028, d + 0.16, C.woodD, {});
  // runner cloth on top
  slab(root, c.x0 - 0.06, c.top + 0.112, -0.86, c.x1 + 0.06, c.top + 0.125, 0.62, C.rust, {});
  slab(root, c.x0 - 0.06, c.top + 0.112, -0.90, c.x1 + 0.06, c.top + 0.128, -0.84, C.cream, {});
  slab(root, c.x0 - 0.06, c.top + 0.112, 0.60, c.x1 + 0.06, c.top + 0.128, 0.66, C.cream, {});
  // hanging scale arm at the near end
  box3(root, c.x0 + 0.10, 1.42, 0.92, 0.06, 0.66, 0.06, C.brass, {});
  box3(root, c.x0 + 0.10, 1.72, 1.18, 0.06, 0.06, 0.56, C.brass, {});
  box3(root, 0.24, 1.56, 1.44, 0.02, 0.30, 0.02, C.brass, {});
  slab(root, 0.14, 1.38, 1.34, 0.34, 1.42, 1.54, C.brass, {});
  box3(root, c.x0 + 0.10, 1.10, 0.92, 0.24, 0.06, 0.24, C.brass, {});
  // ledger + loose coins
  box3(root, 0.38, 1.145, 0.24, 0.30, 0.035, 0.22, C.cream, {});
  box3(root, 0.38, 1.13, 0.24, 0.32, 0.02, 0.24, C.rust, {});
  box3(root, 0.50, 1.19, 0.62, 0.10, 0.13, 0.10, C.emeraldD, {});
  box3(root, 0.40, 1.17, 0.72, 0.08, 0.10, 0.08, C.emerald, {});
  // legs
  var lx = [c.x0 + 0.06, c.x1 - 0.06], lz = [c.z0 + 0.08, c.z1 - 0.08];
  for (i = 0; i < 4; i++) {
    box3(root, lx[i % 2], 0.05, lz[(i / 2) | 0], 0.1, 0.1, 0.1, C.woodD, {});
  }
  // coin tray + weights, far end
  slab(root, 0.24, c.top + 0.115, -1.12, 0.60, c.top + 0.145, -0.86, C.brass, {});
  slab(root, 0.26, c.top + 0.145, -1.10, 0.58, c.top + 0.165, -0.88, C.woodD, {});
  box3(root, 0.38, 1.19, -1.02, 0.09, 0.12, 0.09, C.emeraldD, {});
  box3(root, 0.48, 1.18, -1.06, 0.08, 0.11, 0.08, C.emerald, {});
  box3(root, 0.30, 1.17, -0.58, 0.15, 0.11, 0.15, C.brass, {});

  // ---- lever on the near-left corner
  var lv = L.lever;
  box3(root, lv[0], c.top + 0.15, lv[2], 0.34, 0.09, 0.26, C.brass, {});
  box3(root, lv[0], c.top + 0.26, lv[2], 0.13, 0.22, 0.13, C.woodD, {});
  var lXf = xfMul(xfT(lv[0] - 0.02, c.top + 0.34, lv[2]), xfRotX(0.5 + 1.05 * m.lever));
  box3(lXf, 0, 0.20, 0, 0.07, 0.42, 0.07, C.brass, {});
  box3(lXf, 0, 0.42, 0, 0.15, 0.15, 0.15, C.redstone, { flat: true, lift: 0.05 });

  // ---- redstone conduit: lever -> table leg -> floor -> hatch
  var pulse = m.wire;
  var glowCol = mixc([96, 34, 28], [255, 132, 64], 0.22 + 0.78 * pulse);
  var segs = [
    [[lv[0] - 0.02, 1.10, lv[2] - 0.16], [lv[0] - 0.02, 1.10, lv[2] - 0.30]],
    [[lv[0] - 0.02, 1.10, lv[2] - 0.30], [0.02, 0.20, lv[2] - 0.30]],
    [[0.02, 0.05, 1.20], [0.55, 0.05, 1.36]],
    [[0.55, 0.05, 1.36], [1.30, 0.05, 1.28]],
    [[1.30, 0.05, 1.28], [1.75, 0.05, 0.95]]
  ];
  for (i = 0; i < segs.length; i++) drawWire(root, segs[i][0], segs[i][1], glowCol, pulse);
  // junction box where the emerald grabs it
  box3(root, 0.72, 0.30, 1.38, 0.22, 0.22, 0.18, C.brass, {});
  box3(root, 0.72, 0.30, 1.285, 0.11, 0.11, 0.04, glowCol, { flat: true });

  // ---- awning
  slab(root, -1.32, 0, -2.05, -1.16, 3.06, -1.89, C.wood, {});
  slab(root, 1.86, 0, -2.05, 2.02, 3.06, -1.89, C.wood, {});
  slab(root, -1.40, 0, -2.13, -1.08, 0.20, -1.81, C.woodD, {});
  slab(root, 1.78, 0, -2.13, 2.10, 0.20, -1.81, C.woodD, {});
  var aw = xfMul(root, xfRotX(-0.09));
  slab(aw, -1.44, 3.04, -2.12, 2.10, 3.16, 0.44, C.rust, {});
  for (i = 0; i < 6; i++) {
    var ax = -1.44 + i * (3.54 / 6);
    slab(aw, ax, 3.04, -2.08, ax + 3.54 / 6 - 0.025, 3.17, 0.40, i % 2 ? C.cream : C.rust, {});
  }
  for (i = 0; i < 6; i++) {
    var vx = -1.44 + i * (3.54 / 6);
    slab(aw, vx, 2.86, 0.37, vx + 3.54 / 6 - 0.025, 3.05, 0.44, i % 2 ? C.cream : C.rust, {});
  }

  // ---- lanterns
  lantern(root, -1.30, 2.42, -1.20, st);
  lantern(root, 1.94, 2.42, -1.20, st);
  // ---- hanging shingle, left of the booth
  var sf2 = st.mech.signFlip || 0;
  var sg = xfMul(root, xfT(-1.10, 2.34, 0.18));
  sg = xfMul(sg, xfRotX(-0.75 * sf2));
  box3(sg, -0.20, 0.33, 0, 0.025, 0.66, 0.025, C.woodD, {});
  box3(sg, 0.20, 0.33, 0, 0.025, 0.66, 0.025, C.woodD, {});
  box3(sg, 0, -0.05, 0, 0.86, 0.52, 0.06, C.woodD, {});
  box3(sg, 0, -0.05, 0.04, 0.78, 0.44, 0.02, sf2 > 0.5 ? C.pitW : C.cream, { flat: true, lift: -0.05 });
  if (sf2 < 0.6) {
    box3(sg, -0.20, -0.02, 0.055, 0.16, 0.22, 0.02, C.emerald, { flat: true });
    box3(sg, -0.20, -0.02, 0.065, 0.07, 0.1, 0.02, [190, 255, 220], { flat: true });
    box3(sg, 0.16, 0.06, 0.055, 0.09, 0.09, 0.02, C.brass, { flat: true });
    box3(sg, 0.16, -0.12, 0.055, 0.09, 0.09, 0.02, C.brass, { flat: true });
    box3(sg, 0.02, -0.02, 0.055, 0.10, 0.03, 0.02, C.woodD, {});
  }
}
function drawWire(root, a, b, col, pulse) {
  var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
  var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
  var n = Math.max(2, Math.round(len / 0.16));
  for (var i = 0; i < n; i++) {
    var k0 = i / n, k1 = (i + 1) / n;
    var p0 = [a[0] + dx * k0, a[1] + dy * k0, a[2] + dz * k0];
    var p1 = [a[0] + dx * k1, a[1] + dy * k1, a[2] + dz * k1];
    var w = 0.032, quad;
    if (Math.abs(dy) > Math.abs(dx) + Math.abs(dz)) {
      quad = [[p0[0] + w, p0[1], p0[2] - w], [p1[0] + w, p1[1], p1[2] - w],
              [p1[0] + w, p1[1], p1[2] + w], [p0[0] + w, p0[1], p0[2] + w]];
    } else {
      quad = [[p0[0] - w, p0[1] + w, p0[2]], [p1[0] - w, p1[1] + w, p1[2]],
              [p1[0] + w, p1[1] + w, p1[2]], [p0[0] + w, p0[1] + w, p0[2]]];
    }
    var q = [xfApply(root, quad[0]), xfApply(root, quad[1]), xfApply(root, quad[2]), xfApply(root, quad[3])];
    var c = mixc(C.redstone, [255, 150, 80], pulse * (0.4 + 0.6 * hash2(i, 3.2)));
    face(q, c, { flat: true, lift: 0.05, twoSided: true, stroke: false });
  }
}
function lantern(root, x, y, z, st) {
  box3(root, x, y + 0.36, z, 0.035, 0.5, 0.035, C.woodD, {});
  box3(root, x, y + 0.16, z, 0.26, 0.07, 0.26, C.brass, {});
  box3(root, x, y, z, 0.22, 0.24, 0.22, C.cream, { flat: true, lift: -0.2 });
  box3(root, x, y, z, 0.15, 0.17, 0.15, [255, 214, 148], { flat: true });
  box3(root, x, y - 0.15, z, 0.26, 0.06, 0.26, C.brass, {});
  glowAt(xfApply(root, [x, y, z]), 0.85, [255, 196, 120], 0.5);
}


/* ---------------------------------------------------------------- trapdoor */
function buildTrap(root, st) {
  var m = st.mech, h = L.hole, mt = L.mat, i;
  var dep = h.depth;
  var cxh = (h.x0 + h.x1) / 2, czh = (h.z0 + h.z1) / 2;
  // ---- pit
  face([xfApply(root, [h.x0, 0, h.z0]), xfApply(root, [h.x1, 0, h.z0]),
        xfApply(root, [h.x1, -dep, h.z0]), xfApply(root, [h.x0, -dep, h.z0])], C.pitW, { n: [0, 0, 1], stroke: false });
  face([xfApply(root, [h.x1, 0, h.z1]), xfApply(root, [h.x0, 0, h.z1]),
        xfApply(root, [h.x0, -dep, h.z1]), xfApply(root, [h.x1, -dep, h.z1])], C.pitW, { n: [0, 0, -1], stroke: false });
  face([xfApply(root, [h.x0, 0, h.z1]), xfApply(root, [h.x0, 0, h.z0]),
        xfApply(root, [h.x0, -dep, h.z0]), xfApply(root, [h.x0, -dep, h.z1])], C.pitW, { n: [-1, 0, 0], stroke: false });
  face([xfApply(root, [h.x1, 0, h.z0]), xfApply(root, [h.x1, 0, h.z1]),
        xfApply(root, [h.x1, -dep, h.z1]), xfApply(root, [h.x1, -dep, h.z0])], C.pitW, { n: [1, 0, 0], stroke: false });
  face([xfApply(root, [h.x0, -dep, h.z0]), xfApply(root, [h.x1, -dep, h.z0]),
        xfApply(root, [h.x1, -dep, h.z1]), xfApply(root, [h.x0, -dep, h.z1])], C.pit, { n: [0, 1, 0], stroke: false });
  box3(root, h.x0 + 0.5, -dep + 0.26, h.z1 - 0.5, 0.6, 0.52, 0.6, C.woodD, {});
  box3(root, h.x1 - 0.45, -dep + 0.18, h.z0 + 0.5, 0.42, 0.36, 0.42, C.wood, {});
  box3(root, h.x0 + 1.0, -dep + 0.07, h.z0 + 1.0, 0.55, 0.14, 0.45, C.pitL, {});
  glowAt(xfApply(root, [h.x1 - 0.35, -dep + 0.4, h.z0 + 0.4]), 0.6, [255, 96, 60], 0.3);

  // ---- rim, hatch and mechanism are hidden while the rug covers them
  var showTrap = m.mechanism > 0.001 || m.hatch > 0.004 || m.rugFlip > 0.18 || m.rugFly > 0.38;
  var rimC = C.woodL, SORTF = { sortAdd: 1.5 };
  if (showTrap) {
  slab(root, h.x0 - 0.10, 0.004, h.z0 - 0.10, h.x1 + 0.10, 0.050, h.z0, rimC, SORTF);
  slab(root, h.x0 - 0.10, 0.004, h.z1, h.x1 + 0.10, 0.050, h.z1 + 0.10, rimC, SORTF);
  slab(root, h.x0 - 0.10, 0.004, h.z0, h.x0, 0.050, h.z1, rimC, SORTF);
  slab(root, h.x1, 0.004, h.z0, h.x1 + 0.10, 0.050, h.z1, rimC, SORTF);
  // a lamp on the pit wall so the fall is readable
  box3(root, h.x0 + 0.52, -0.62, h.z1 - 0.18, 0.14, 0.18, 0.10, [255, 168, 88], { flat: true });
  glowAt(xfApply(root, [h.x0 + 0.52, -0.62, h.z1 - 0.30]), 1.5, [255, 150, 70], 0.55);
  glowAt(xfApply(root, [cxh, -1.5, czh]), 1.9, [255, 120, 60], 0.25);

  // ---- hatch leaves
  var open = m.hatch;
  var mid = (h.z0 + h.z1) / 2;
  var lw = (h.x1 - h.x0) - 0.04, ld = (h.z1 - h.z0) / 2 - 0.02;
  var openA = ss(st.t, TRAP_AT, TRAP_AT + 0.30);
  var openB = ss(st.t, TRAP_AT + 0.07, TRAP_AT + 0.37);
  if (openA < 0.02) openA = 0;
  var xfA = xfMul(root, xfT(cxh, 0.012, h.z0));
  xfA = xfMul(xfA, xfRotX(-openA * 2.9));
  box3(xfA, 0, 0, ld, lw, 0.045, ld, C.wood, SORTF);
  for (i = 0; i < 3; i++) box3(xfA, 0, 0.026, ld * (0.4 + i * 0.4), lw - 0.1, 0.02, 0.07, C.woodD, SORTF);
  box3(xfA, -lw * 0.34, 0.03, 0.12, 0.16, 0.05, 0.10, C.brass, {});
  box3(xfA, lw * 0.34, 0.03, 0.12, 0.16, 0.05, 0.10, C.brass, {});
  var xfB = xfMul(root, xfT(cxh, 0.012, h.z1));
  xfB = xfMul(xfB, xfRotX(openB * 2.9));
  box3(xfB, 0, 0, -ld, lw, 0.045, ld, C.woodL, SORTF);
  for (i = 0; i < 3; i++) box3(xfB, 0, 0.026, -ld * (0.4 + i * 0.4), lw - 0.1, 0.02, 0.07, C.woodD, SORTF);
  box3(xfB, -lw * 0.34, 0.03, -0.12, 0.16, 0.05, 0.10, C.brass, {});
  box3(xfB, lw * 0.34, 0.03, -0.12, 0.16, 0.05, 0.10, C.brass, {});
  box3(xfB, 0, 0.03, -0.10, 0.09, 0.03, 0.14, C.brass, {});
  }

  // ---- mechanism (revealed by INSPECT REAR)
  if (m.mechanism > 0.01) {
    var rise = -0.16 * (1 - m.mechanism);
    // frame
    slab(root, h.x0 + 0.10, 0.03 + rise, h.z0 + 0.10, h.x1 - 0.10, 0.11 + rise, h.z0 + 0.20, C.brass, {});
    slab(root, h.x0 + 0.10, 0.03 + rise, h.z1 - 0.20, h.x1 - 0.10, 0.11 + rise, h.z1 - 0.10, C.brass, {});
    slab(root, h.x0 + 0.10, 0.03 + rise, h.z0 + 0.20, h.x0 + 0.20, 0.11 + rise, h.z1 - 0.20, C.brass, {});
    slab(root, h.x1 - 0.20, 0.03 + rise, h.z0 + 0.20, h.x1 - 0.10, 0.11 + rise, h.z1 - 0.20, C.brass, {});
    // plate
    slab(root, cxh - 0.44, 0.11 + rise, czh - 0.40, cxh + 0.44, 0.18 + rise, czh + 0.40, C.stone, {});
    slab(root, cxh - 0.44, 0.18 + rise, czh - 0.40, cxh + 0.44, 0.20 + rise, czh + 0.40, C.pitL, {});
    slab(root, cxh - 0.11, 0.20 + rise, czh - 0.11, cxh + 0.11, 0.22 + rise, czh + 0.11, C.redstone, { flat: true });
    // springs
    var rr = 0.62;
    for (i = 0; i < 4; i++) {
      var sx = cxh + (i % 2 ? rr : -rr), sz = czh + (i < 2 ? -rr : rr);
      for (var k = 0; k < 3; k++) {
        box3(root, sx, 0.14 + k * 0.10 + rise, sz, 0.17, 0.05, 0.17, k % 2 ? C.stone : C.stone3, {});
        box3(root, sx, 0.185 + k * 0.10 + rise, sz, 0.09, 0.04, 0.09, C.stone, {});
      }
    }
    // piston
    box3(root, cxh, 0.30 + rise, h.z0 + 0.26, 0.26, 0.20, 0.26, C.brass, {});
    box3(root, cxh, 0.45 + rise, h.z0 + 0.30, 0.12, 0.22, 0.12, C.stone3, {});
    // gear
    var gx = xfMul(root, xfT(h.x1 - 0.34, 0.15 + rise, h.z0 + 0.34));
    gx = xfMul(gx, xfRotY(st.t * 1.6));
    box3(gx, 0, 0, 0, 0.30, 0.06, 0.30, C.brass, {});
    box3(gx, 0.20, 0, 0, 0.10, 0.05, 0.10, C.brass, {});
    box3(gx, -0.20, 0, 0, 0.10, 0.05, 0.10, C.brass, {});
    box3(gx, 0, 0, 0.20, 0.10, 0.05, 0.10, C.brass, {});
    box3(gx, 0, 0, -0.20, 0.10, 0.05, 0.10, C.brass, {});
    // warning lamp
    box3(root, h.x0 + 0.32, 0.23 + rise, h.z0 + 0.32, 0.18, 0.18, 0.18, [255, 90, 60], { flat: true });
    var blink = 0.55 + 0.45 * Math.sin(st.t * 5.0);
    glowAt(xfApply(root, [h.x0 + 0.32, 0.23 + rise, h.z0 + 0.32]), 0.55, [255, 110, 70], 0.35 * blink);
  }

  // ---- rug
  var lift = m.rugLift, flip = m.rugFlip, fly = m.rugFly;
  var hingeZ = mt.cz + mt.d / 2;
  var rug = xfMul(root, xfT(mt.cx + 1.05 * fly, 0.082 - 0.03 * fly + 0.30 * Math.sin(fly * Math.PI), hingeZ + 0.62 * fly));
  rug = xfMul(rug, xfRotX(-flip * 2.95 - lift * 0.85));
  rug = xfMul(rug, xfT(-mt.cx, 0, -hingeZ));
  var rw = mt.w / 2, rd = mt.d / 2;
  box3(rug, mt.cx, 0.028, mt.cz, mt.w, 0.055, mt.d, C.matA, {});
  // woven border + central medallion
  box3(rug, mt.cx, 0.056, mt.cz - rd + 0.11, mt.w - 0.18, 0.013, 0.08, C.matB, {});
  box3(rug, mt.cx, 0.056, mt.cz + rd - 0.11, mt.w - 0.18, 0.013, 0.08, C.matB, {});
  box3(rug, mt.cx - rw + 0.11, 0.056, mt.cz, 0.08, 0.013, mt.d - 0.18, C.matB, {});
  box3(rug, mt.cx + rw - 0.11, 0.056, mt.cz, 0.08, 0.013, mt.d - 0.18, C.matB, {});
  box3(rug, mt.cx, 0.057, mt.cz - rd + 0.20, mt.w - 0.34, 0.012, 0.05, C.matC, {});
  box3(rug, mt.cx, 0.057, mt.cz + rd - 0.20, mt.w - 0.34, 0.012, 0.05, C.matC, {});
  box3(rug, mt.cx - rw + 0.20, 0.057, mt.cz, 0.05, 0.012, mt.d - 0.34, C.matC, {});
  box3(rug, mt.cx + rw - 0.20, 0.057, mt.cz, 0.05, 0.012, mt.d - 0.34, C.matC, {});
  box3(rug, mt.cx, 0.058, mt.cz, 0.62, 0.014, 0.34, C.matB, {});
  box3(rug, mt.cx, 0.059, mt.cz, 0.36, 0.014, 0.18, C.matC, {});
  box3(rug, mt.cx, 0.060, mt.cz, 0.14, 0.014, 0.14, C.matB, {});

function buildDust(root, st) {

      var pz = e.z + Math.sin(an) * sp * age;
      var py = e.y + (0.4 + s2 * 1.0) * age - 0.95 * age * age;

/* ============================================================================
   UI — canvas plumbing, transport, inputs, and the public bench hook.
   ========================================================================== */
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var DPR = 1, VW = 1, VH = 1;

var app = {
  t: 0, playing: false, speed: 1, actions: [], origin: [0, 0, 0]
};
var lastFrame = 0;

function resize() {
  var rect = canvas.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(2, Math.round(rect.width));
  VH = Math.max(2, Math.round(rect.height));
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);

/* ---------------------------------------------------------------- scene draw */
var bgCanvas = null, bgW = 0, bgH = 0, vigCanvas = null;
function bakeBackdrop(W, H) {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W; bgCanvas.height = H;
  var bctx = bgCanvas.getContext('2d');
  bakeBackdropInto(bctx, W, H);
  vigCanvas = document.createElement('canvas');
  vigCanvas.width = W; vigCanvas.height = H;
  var vctx = vigCanvas.getContext('2d');
  var g = vctx.createRadialGradient(W * 0.5, H * 0.48, Math.min(W, H) * 0.34, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(4,6,7,0.62)');
  vctx.fillStyle = g;
  vctx.fillRect(0, 0, W, H);
  bgW = W; bgH = H;
}
function drawBackdrop(W, H) {
  if (!bgCanvas || bgW !== W || bgH !== H) bakeBackdrop(W, H);
  ctx.drawImage(bgCanvas, 0, 0);
}
function bakeBackdropInto(ctx, W, H) {
  var g = ctx.createRadialGradient(W * 0.48, H * 0.46, Math.min(W, H) * 0.10, W * 0.5, H * 0.52, Math.max(W, H) * 0.80);
  g.addColorStop(0, '#1d2724');
  g.addColorStop(0.45, '#131b1c');
  g.addColorStop(1, '#070a0b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // a warm bounce behind the booth
  var bp = project(R.cam, [R.st.origin[0] + 0.1, R.st.origin[1] + 1.4, R.st.origin[2] - 1.6]);
  if (bp) {
    var rg = ctx.createRadialGradient(bp[0], bp[1], 10, bp[0], bp[1], Math.max(W, H) * 0.42);
    rg.addColorStop(0, 'rgba(255,178,108,0.15)');
    rg.addColorStop(0.5, 'rgba(190,120,80,0.055)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
  // cool haze at the top
  var tg = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  tg.addColorStop(0, 'rgba(60,110,120,0.10)');
  tg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.55);
}

function drawGlows() {
  if (!R.glows.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < R.glows.length; i++) {
    var g = R.glows[i];
    if (g.r <= 0.2) continue;
    var rg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
    rg.addColorStop(0, 'rgba(' + g.c[0] + ',' + g.c[1] + ',' + g.c[2] + ',' + (g.a * 0.85).toFixed(3) + ')');
    rg.addColorStop(0.45, 'rgba(' + g.c[0] + ',' + g.c[1] + ',' + g.c[2] + ',' + (g.a * 0.22).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(' + g.c[0] + ',' + g.c[1] + ',' + g.c[2] + ',0)');
    ctx.fillStyle = rg;
    ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawMarks() {
  for (var i = 0; i < R.marks.length; i++) {
    var m = R.marks[i];
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, 6.2832);
    ctx.fillStyle = m.c;
    ctx.fill();
  }
}
function drawEmeraldFace(st) {

  ctx.beginPath(); ctx.ellipse(p[0] + ex, ey, ew, eh, 0, 0, 6.2832); ctx.fill();
  if (em.eyes > 0.4) {
    ctx.fillStyle = 'rgba(215,255,232,0.85)';
    var gl = Math.max(0.6, ew * 0.30);
    ctx.beginPath(); ctx.arc(p[0] - ex - ew * 0.25, ey - eh * 0.35, gl, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(p[0] + ex - ew * 0.25, ey - eh * 0.35, gl, 0, 6.2832); ctx.fill();

    var gg = ctx.createRadialGradient(gx2, gy, 0, gx2, gy, r * 1.1);
    gg.addColorStop(0, 'rgba(120,255,180,' + (0.35 * k).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(120,255,180,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(gx2 - r * 1.2, gy - r * 1.2, r * 2.4, r * 2.4);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(226,255,238,' + (0.92 * k).toFixed(3) + ')';
    var bw = Math.max(2, r * 0.16), bh = r * 0.46;
    ctx.fillRect(gx2 - bw / 2, gy - bh * 0.9, bw, bh);
    ctx.fillRect(gx2 - bw / 2, gy + bh * 0.28, bw, bw * 1.05);
  }
}
function drawVignette(W, H) {
  if (!vigCanvas || bgW !== W || bgH !== H) bakeBackdrop(W, H);
  ctx.drawImage(vigCanvas, 0, 0);
}

function renderScene(st) {
  var W = VW, H = VH;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  beginFrame(st, W, H);
  drawBackdrop(W, H);
  var o = st.origin;
  var root = xfT(o[0], o[1], o[2]);
  buildGround(root, st);
  buildBackdrop(root, st);
  buildBooth(root, st);
  buildTrap(root, st);
  buildShadows(root, st);
  buildMerchant(root, st);
  buildCustomer(root, st);
  buildEmerald(root, st);
  buildProps(root, st);
  buildDust(root, st);
  buildSparkles(root, st);
  if (window.__dbgFaces !== undefined) window.__dbgFaces = R.faces.length;
  if (window.__dbgBig) {
    var tmp = R.faces.map(function(f){ var xs=f.p.filter(function(_,i){return i%2===0;}), ys=f.p.filter(function(_,i){return i%2===1;});
      return {c:f.c, z:Math.round(f.z), w:Math.round(Math.max.apply(null,xs)-Math.min.apply(null,xs)), h:Math.round(Math.max.apply(null,ys)-Math.min.apply(null,ys)), x:Math.round(Math.min.apply(null,xs)), y:Math.round(Math.min.apply(null,ys))}; });
    tmp.sort(function(a,b){ return b.w*b.h - a.w*a.h; });
    window.__dbgBig = tmp.slice(0, 12);
  }
  drawFrame(ctx);
  drawGlows();
  drawMarks();
  drawEmeraldFace(st);
  drawVignette(W, H);
}

/* ---------------------------------------------------------------- hud */
var el = {
  play: document.getElementById('play'), playLabel: document.getElementById('playLabel'),
  playIcon: document.getElementById('playIcon'),
  clock: document.getElementById('clockNow'),
  seek: document.getElementById('seek'), fill: document.getElementById('seekFill'),
  knob: document.getElementById('seekKnob'), win: document.getElementById('seekWin'),
  reset: document.getElementById('reset'), speeds: document.getElementById('speeds'),
  stBranch: document.getElementById('stBranch'), stHeld: document.getElementById('stHeld'),
  stRear: document.getElementById('stRear'), stTrap: document.getElementById('stTrap'),
  ox: document.getElementById('ox'), oy: document.getElementById('oy'), oz: document.getElementById('oz'),
  originReset: document.getElementById('originReset')
};
var inBtns = [document.getElementById('inTake'), document.getElementById('inReturn'), document.getElementById('inInspect')];

function pad(v) { return (v < 10 ? '0' : '') + v.toFixed(2); }
var hudCache = {};
function updateHud(st) {
  if (hudCache.clock !== st.t) {
    el.clock.textContent = pad(st.t);
    hudCache.clock = st.t;
  }
  var pct = st.t / T_MAX;
  el.fill.style.width = (pct * 100).toFixed(3) + '%';
  el.knob.style.left = (pct * 100).toFixed(3) + '%';
  el.seek.setAttribute('aria-valuenow', st.t.toFixed(2));
  var open = st.t >= WIN_A && st.t < WIN_B;
  if (hudCache.open !== open) {
    for (var i = 0; i < inBtns.length; i++) inBtns[i].classList.toggle('off', !open);
    hudCache.open = open;
  }
  if (hudCache.branch !== st.branch) {
    el.stBranch.textContent = st.branch;
    el.stBranch.className = 'v ' + (st.branch === 'pending' ? 'mute' : st.branch === 'trap' ? 'bad' : st.branch === 'safe' ? 'on' : 'warn');
    hudCache.branch = st.branch;
  }
  if (hudCache.held !== st.held) {
    el.stHeld.textContent = st.held ? 'customer' : 'counter';
    el.stHeld.className = 'v' + (st.held ? ' on' : '');
    hudCache.held = st.held;
  }
  if (hudCache.insp !== st.inspected) {
    el.stRear.textContent = st.inspected ? 'exposed' : 'concealed';
    el.stRear.className = 'v' + (st.inspected ? ' warn' : ' mute');
    hudCache.insp = st.inspected;
  }
  if (hudCache.trap !== st.trapOpen) {
    el.stTrap.textContent = st.trapOpen ? 'open' : 'shut';
    el.stTrap.className = 'v' + (st.trapOpen ? ' bad' : ' mute');
    hudCache.trap = st.trapOpen;
  }
  var label = app.playing ? 'Pause' : (st.t >= T_MAX ? 'Replay' : 'Play');
  if (hudCache.label !== label) {
    el.playLabel.textContent = label;
    el.playIcon.className = 'tri ' + (app.playing ? 's' : 'p');
    hudCache.label = label;
  }
}

/* ---------------------------------------------------------------- loop */
function frame(now) {
  if (app.playing) {
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.12, (now - lastFrame) / 1000);
    lastFrame = now;
    app.t = Math.min(T_MAX, app.t + dt * app.speed);
    if (app.t >= T_MAX) setPlaying(false);
  } else {
    lastFrame = 0;
  }
  var st = simulate(app.t, app.actions, app.origin);
  renderScene(st);
  updateHud(st);
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- controls */
function setPlaying(v) {
  app.playing = !!v;
  lastFrame = 0;
  if (app.playing && app.t >= T_MAX) app.t = 0;
  hudCache.label = null;
}
function seekTo(t) {
  app.t = clamp(t, 0, T_MAX);
  lastFrame = 0;
  hudCache.clock = null;
}
function resetAll() {
  setPlaying(false);
  app.t = 0;
  app.actions.length = 0;
  lastFrame = 0;
  hudCache.label = null;
  hudCache.clock = null;
}
function addAction(type) {
  if (app.t < WIN_A || app.t >= WIN_B) {
    var b = type === 'take' ? inBtns[0] : type === 'return' ? inBtns[1] : inBtns[2];
    b.classList.remove('flash');
    void b.offsetWidth;
    b.classList.add('flash');
    return;
  }
  // an input placed in the past discards everything recorded after it
  var keep = [];
  for (var i = 0; i < app.actions.length; i++) {
    if (app.actions[i].time <= app.t) keep.push(app.actions[i]);
  }
  app.actions = keep;
  app.actions.push({ time: app.t, type: type });
  lastFrame = 0;
}

function initControls() {
  // seek: click and drag
  var dragging = false;
  function posToTime(ev) {
    var r = el.seek.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    return clamp(x / Math.max(1, r.width), 0, 1) * T_MAX;
  }
  el.seek.addEventListener('pointerdown', function (ev) {
    dragging = true;
    try { el.seek.setPointerCapture(ev.pointerId); } catch (e) {}
    seekTo(posToTime(ev));
    el.seek.focus();
    ev.preventDefault();
  });
  el.seek.addEventListener('pointermove', function (ev) {
    if (dragging) seekTo(posToTime(ev));
  });
  el.seek.addEventListener('pointerup', function () { dragging = false; });
  el.seek.addEventListener('pointercancel', function () { dragging = false; });
  el.seek.addEventListener('keydown', function (ev) {
    var step = ev.shiftKey ? 1 : 0.1;
    if (ev.key === 'ArrowRight') { seekTo(app.t + step); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft') { seekTo(app.t - step); ev.preventDefault(); }
    else if (ev.key === 'Home') { seekTo(0); ev.preventDefault(); }
    else if (ev.key === 'End') { seekTo(T_MAX); ev.preventDefault(); }
  });

  el.play.addEventListener('click', function () { setPlaying(!app.playing); });
  el.reset.addEventListener('click', resetAll);
  el.speeds.addEventListener('click', function (ev) {
    var b = ev.target.closest('.sb');
    if (!b) return;
    app.speed = parseFloat(b.getAttribute('data-sp'));
    var all = el.speeds.querySelectorAll('.sb');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i] === b);
  });
  inBtns[0].addEventListener('click', function () { addAction('take'); });
  inBtns[1].addEventListener('click', function () { addAction('return'); });
  inBtns[2].addEventListener('click', function () { addAction('inspect'); });

  function readOrigin() {
    var x = numOr(el.ox.value, 0), y = numOr(el.oy.value, 0), z = numOr(el.oz.value, 0);
    app.origin = [x, y, z];
    lastFrame = 0;
  }
  [el.ox, el.oy, el.oz].forEach(function (inp) {
    inp.addEventListener('input', readOrigin);
    inp.addEventListener('change', readOrigin);
  });
  el.originReset.addEventListener('click', function () {
    el.ox.value = '0'; el.oy.value = '0'; el.oz.value = '0';
    app.origin = [0, 0, 0];
  });

  window.addEventListener('keydown', function (ev) {
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (ev.key === ' ' || ev.code === 'Space') { setPlaying(!app.playing); ev.preventDefault(); }
    else if (ev.key === 'q' || ev.key === 'Q') addAction('take');
    else if (ev.key === 'w' || ev.key === 'W') addAction('return');
    else if (ev.key === 'e' || ev.key === 'E') addAction('inspect');
    else if (ev.key === 'r' || ev.key === 'R') resetAll();
    else if (ev.key === 'ArrowRight') { seekTo(app.t + (ev.shiftKey ? 1 : 0.1)); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft') { seekTo(app.t - (ev.shiftKey ? 1 : 0.1)); ev.preventDefault(); }
  });

  // window band + ticks on the seek rail
  el.win.style.left = (WIN_A / T_MAX * 100) + '%';
  el.win.style.width = ((WIN_B - WIN_A) / T_MAX * 100) + '%';
  var ticks = document.getElementById('seekTicks');
  var marks = [{ t: 4, l: '4' }, { t: 12, l: '12' }, { t: 14, l: '14' }];
  for (var i = 0; i < marks.length; i++) {
    var d = document.createElement('div');
    d.className = 'tick major';
    d.style.left = (marks[i].t / T_MAX * 100) + '%';
    var e2 = document.createElement('em');
    e2.textContent = marks[i].l;
    d.appendChild(e2);
    ticks.appendChild(d);
  }
  window.addEventListener('resize', function () { resize(); });
}

/* ---------------------------------------------------------------- bench */
/* window.sceneBench.evaluate is a thin wrapper over simulate(), the exact
   function the render loop uses every frame. */
window.sceneBench = {
  evaluate: function (opts) {
    opts = opts || {};
    var st = simulate(opts.time === undefined ? 0 : opts.time, opts.actions, opts.origin);
    var s = st.snapshot;
    return {
      branch: s.branch,
      held: s.held,
      inspected: s.inspected,
      trapOpen: s.trapOpen,
      actors: {
        merchant: [s.actors.merchant[0], s.actors.merchant[1], s.actors.merchant[2]],
        customer: [s.actors.customer[0], s.actors.customer[1], s.actors.customer[2]],
        emerald: [s.actors.emerald[0], s.actors.emerald[1], s.actors.emerald[2]]
      }
    };
  }
};

/* ---------------------------------------------------------------- boot */
resize();
initControls();
requestAnimationFrame(frame);
window.addEventListener('load', resize);
})();

</script>
</body>
</html>
